    <text x="402" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#6E6E73">公式 · 图片 · 链接</text>
    <text x="402" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#6E6E73">受保护内容完整性</text>
  </g>
  <line x1="616" y1="270" x2="656" y2="270" stroke="#8E8E93" stroke-width="3" marker-end="url(#arrow)"/>
