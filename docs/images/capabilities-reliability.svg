    <text x="96" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#6E6E73">真实更新时间</text>
  </g>
  <line x1="310" y1="270" x2="350" y2="270" stroke="#8E8E93" stroke-width="3" marker-end="url(#arrow)"/>
