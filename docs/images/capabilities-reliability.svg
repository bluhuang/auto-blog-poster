<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">从构建结果到可靠发布</title>
  <desc id="desc">系统通过增量缓存、静态检查、真实浏览器校验和 GitHub Pages 部署保证发布质量。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/></marker>
  </defs>
  <rect width="1200" height="460" rx="32" fill="#F5F5F7"/>
  <text x="64" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#1D1D1F">从构建结果到可靠发布</text>
  <text x="64" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" fill="#6E6E73">构建成功只是开始，页面必须经过检查才能上线</text>
