    <text x="96" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#1D1D1F">变化检测</text>
    <text x="96" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#6E6E73">新增 · 修改 · 删除</text>
    <text x="96" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#6E6E73">移动与重命名迁移</text>
  </g>
  <line x1="310" y1="270" x2="350" y2="270" stroke="#8E8E93" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="370" y="160" width="230" height="220" rx="24" fill="#FFFFFF"/>
    <circle cx="418" cy="208" r="24" fill="#F2ECFF"/>
    <path d="M408 214c6-15 14-15 20 0M411 202h14" stroke="#8E44FF" stroke-width="3" fill="none" stroke-linecap="round"/>
