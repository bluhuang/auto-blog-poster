<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">从私人笔记到公开文章</title>
  <desc id="desc">系统依次完成内容变化检测、AI 脱敏润色、Obsidian 内容转换和 Hugo 网站生成。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/></marker>
  </defs>
  <rect width="1200" height="460" rx="32" fill="#F5F5F7"/>
  <text x="64" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#1D1D1F">从私人笔记到公开文章</text>
  <text x="64" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" fill="#6E6E73">不是简单复制 Markdown，而是一条完整的内容公开化流水线</text>
  <g filter="url(#shadow)">
