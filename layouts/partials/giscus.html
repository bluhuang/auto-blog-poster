{{ with site.Params.giscus }}
  {{ if .enable }}
    <div class="mt-16">
      <h2 class="h4 mb-6">💬 留言</h2>
      <div id="giscus"></div>
      <script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repo_id }}"
        data-category="{{ .category }}"
        data-category-id="{{ .category_id }}"
        data-mapping="{{ .mapping }}"
        data-reactions-enabled="{{ .reactions_enabled }}"
        data-emit-metadata="{{ .emit_metadata }}"
        data-input-position="{{ .input_position }}"
        data-lang="{{ .lang }}"
        data-theme="light"
        crossorigin="anonymous"
        async>
      </script>
      <script>
        (function () {
          var LIGHT_THEMES = ['light', 'noborder_light'];
          var DARK_THEMES = ['noborder_dark', 'dark_dimmed', 'dark'];
          function getTheme() {
            return document.documentElement.classList.contains('dark')
              ? DARK_THEMES[1] : LIGHT_THEMES[0];
          }
          function syncGiscus() {
            if (window.giscus && typeof window.giscus.setTheme === 'function') {
              try { window.giscus.setTheme(getTheme()); } catch (e) {}
            }
          }
          // 轮询等待 giscus 加载完成，确保初始主题正确
          function waitAndSync(attempts) {
            attempts = attempts || 0;
            if (attempts > 50) return;
            syncGiscus();
            if (!window.giscus || typeof window.giscus.setTheme !== 'function') {
              setTimeout(function() { waitAndSync(attempts + 1); }, 100);
            }
          }
          waitAndSync();
          // 监听 <html> class 变化（主题切换）
          new MutationObserver(syncGiscus).observe(document.documentElement, {
            attributes: true, attributeFilter: ['class']
          });
          // 兜底：用户点击主题切换按钮后立即触发
          document.addEventListener('click', function (e) {
            var t = e.target;
            if (t && (t.closest('[data-theme-switcher]') || t.closest('.theme-switcher'))) {
              setTimeout(syncGiscus, 50);
            }
          });
        })();
      </script>
    </div>
  {{ end }}
{{ end }}
