{{/* Homepage uses the compact top-input Giscus presentation; other pages retain the standard layout. */}}
{{ $page := . }}
{{ with site.Params.giscus }}
  {{ if .enable }}
    <div class="mt-16">
      <h2 class="h4 mb-6">💬 留言</h2>
      <div id="giscus"></div>
      <script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repo_id }}"
        data-category="{{ .category }}"
        data-category-id="{{ .category_id }}"
        data-mapping="{{ .mapping }}"
        data-reactions-enabled="{{ .reactions_enabled }}"
        data-emit-metadata="{{ .emit_metadata }}"
        data-input-position="{{ if $page.IsHome }}top{{ else }}{{ .input_position }}{{ end }}"
        data-lang="{{ .lang }}"
        data-theme="{{ if $page.IsHome }}noborder_light{{ else }}light{{ end }}"
        crossorigin="anonymous"
        async>
      </script>
      <script>
        (function () {
          var HOME_GISCUS = {{ if $page.IsHome }}true{{ else }}false{{ end }};
          function getTheme() {
            if (document.documentElement.classList.contains('dark')) {
              return HOME_GISCUS ? 'noborder_dark' : 'dark_dimmed';
            }
            return HOME_GISCUS ? 'noborder_light' : 'light';
          }
          function syncGiscus() {
            if (window.giscus && typeof window.giscus.setTheme === 'function') {
              try { window.giscus.setTheme(getTheme()); } catch (e) {}
            }
          }
          function waitAndSync(attempts) {
            attempts = attempts || 0;
            if (attempts > 50) return;
            syncGiscus();
            if (!window.giscus || typeof window.giscus.setTheme !== 'function') {
              setTimeout(function() { waitAndSync(attempts + 1); }, 100);
            }
          }
          waitAndSync();
          new MutationObserver(syncGiscus).observe(document.documentElement, {
            attributes: true, attributeFilter: ['class']
          });
          document.addEventListener('click', function (e) {
            var t = e.target;
            if (t && (t.closest('[data-theme-switcher]') || t.closest('.theme-switcher'))) {
              setTimeout(syncGiscus, 50);
            }
          });
        })();
      </script>
    </div>
  {{ end }}
{{ end }}
