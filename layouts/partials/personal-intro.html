{{ with site.Params.personal }}
  <div class="mb-10">
    <div class="flex flex-col items-center lg:flex-row lg:items-start gap-6">
      {{ if .avatar }}
        <img src="{{ .avatar | relURL }}" alt="avatar" class="rounded-full w-24 h-24 object-cover shrink-0">
      {{ end }}
      <div class="text-center lg:text-left">
        <h1 class="h3">{{ .name }}</h1>
        <p class="text-text-light">{{ .bio }}</p>
        <p class="mt-2">{{ .intro | markdownify }}</p>
        {{ with site.Params.social }}
          <div class="mt-3 flex justify-center lg:justify-start space-x-4 text-xl">
            {{ range . }}
              <a href="{{ .link }}" target="_blank" rel="noopener" class="text-text-dark dark:text-white hover:text-primary"><i class="{{ .icon }}"></i></a>
            {{ end }}
          </div>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
