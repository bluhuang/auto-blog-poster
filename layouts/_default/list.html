{{ define "main" }}
  {{ if eq .Kind "section" }}
    {{ partial "library-page" . }}
  {{ else }}
    {{ partial "page-header" . }}
    <section class="section">
      <div class="container">
        <div class="grid md:grid-cols-2 gap-6">
          {{ range .RegularPagesRecursive.ByDate.Reverse }}
            {{ partial "components/blog-card" . }}
          {{ end }}
        </div>
      </div>
    </section>
  {{ end }}
{{ end }}
