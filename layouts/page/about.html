{{ define "main" }}
  <section class="section-sm">
    <div class="container">
      <div class="row justify-center">
        <div class="md:col-8 lg:col-6 text-center">
          {{ with site.Params.personal.avatar }}
            <img src="{{ . | relURL }}" alt="avatar" class="mx-auto rounded-full w-32 h-32 object-cover mb-6">
          {{ end }}
          <h1 class="h3 mb-4">{{ .Title }}</h1>
          <div class="content text-left">{{ .Content }}</div>
          {{ with site.Params.social }}
            <div class="mt-6 flex justify-center space-x-4 text-2xl">
              {{ range . }}
                <a href="{{ .link }}" target="_blank" rel="noopener" class="text-text-dark dark:text-white hover:text-primary"><i class="{{ .icon }}"></i></a>
              {{ end }}
            </div>
          {{ end }}
        </div>
      </div>
    </div>
  </section>
{{ end }}
