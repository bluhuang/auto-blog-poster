deployment:
  commit_message: Auto deploy from blog poster [skip ci]
  target_branch: gh-pages
  target_repo: bluhuang/blogs-of-bluhuang
error:
  failed_log: failed_notes.log
  max_retries: 3
hugo:
  build_options: --minify
  executable: hugo
output:
  branch: gh-pages
  content_dir: content/
  owner: bluhuang
  repo: blogs-of-bluhuang
  static_dir: static/
processing:
  cache_file: .hash_cache.json
  deepseek_api:
    max_tokens: 65536
    model: deepseek-v4-flash
    prompt_template: 请对以下Markdown内容进行脱敏（删除公司名、人名等）、润色语句、删除所有与"面试"相关的内容。只输出处理后的纯Markdown内容，不要添加任何解释、不要添加"好的"、"以下是处理后的内容"等前缀或后缀，直接输出结果。\n\n原文：\n\n{content}
    system_prompt: '你是一个技术博客编辑助手。请对以下Markdown内容进行脱敏（删除公司名、人名等），并将所有与求职、面试、招聘、简历、offer、跳槽等相关的内容改写成纯粹的技术讨论，删除明显的求职字眼但保留技术实质。同时润色语句。严禁修改任何图片链接格式（包括
      ![[...]] 和 ![](...)），保持原样。所有 @@PROTECTED_...@@ 占位符必须逐字保留，禁止修改、删除、复制、排序或重新排版。只输出处理后的纯Markdown内容，不要添加任何解释或前缀。

      '
    temperature: 0.3
  force_reprocess_all: false
  image_download_dir: static/images/
  image_handling:
    enabled: true
    source_images_dir: attachments
    target_static_dir: static
  image_processing: true
  incremental: true
  code_execution:
    auto_map_windows_notes_root: true
    environment:
      MPLBACKEND: Agg
  section_rules:
  - name: matplotlib_code
    enabled: true
    match:
      level: 1
      title: 'TAG: Matplot code'
      case_sensitive: false
    actions:
    - type: execute_code
      language: python
      fence_languages:
      - python
      - run-python
      timeout_seconds: 120
    - type: exclude_from_blog
  local_vault_path: /Users/pakyen/Library/Mobile Documents/iCloud~md~obsidian/Documents/blu
    obsidian
  personal_images:
    avatar:
      source: ../Avatar.JPG
      target: avatar.jpg
    body_image:
      source: ../汪汪队.jpg
      target: dog-inline.jpg
  title_source: filename
  title_strip_keywords:
    enabled: true
    patterns:
    - 面试
    - ^z_
  title_strip_prefix:
    enabled: true
    pattern: ^\d+\s*[-.]?\s*
source:
  branch: main
  file_pattern: '*.md'
  notes_dir: content/
  notes_subdir: 2 Notes
  owner: bluhuang
  repo: blu-obsidian
validation:
  base_path: /blogs-of-bluhuang
  browser_timeout_ms: 30000
  host: 127.0.0.1
  image_check_paths:
  - /ai/0-paper/cv/4-mobilenetv2---inverted-residuals-and-linear-bottlenecks/
  port: 1314
  published_origin: https://bluhuang.github.io
  public_dir: public
