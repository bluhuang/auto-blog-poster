source:
  repo: "blu-obsidian"
  owner: "bluhuang"
  branch: "main"
  notes_subdir: "2 Notes"
  notes_dir: "content/"
  file_pattern: "*.md"

processing:
  image_processing: true
  image_download_dir: "static/images/"
  incremental: true
  cache_file: ".hash_cache.json"
  image_handling:
    enabled: true
    source_images_dir: ""
    target_static_dir: "static/images"
    wiki_image_lookup:
      - type: "same_dir"
      - type: "relative_subdir"
        subdir: "attachments"
  deepseek_api:
    model: "deepseek-v4-flash"
    temperature: 0.3
    max_tokens: 4000
    prompt_template: '请对以下Markdown内容进行脱敏（删除公司名、人名等）、润色语句、删除所有与"面试"相关的内容。只输出处理后的纯Markdown内容，不要添加任何解释、不要添加"好的"、"以下是处理后的内容"等前缀或后缀，直接输出结果。\n\n原文：\n\n{content}'

output:
  repo: "blogs-of-bluhuang"
  owner: "bluhuang"
  branch: "gh-pages"
  content_dir: "content/"
  static_dir: "static/"

error:
  failed_log: "failed_notes.log"
  max_retries: 3

hugo:
  executable: "hugo"
  build_options: "--minify"
  base_url: "https://bluhuang.github.io/blogs-of-bluhuang/"
  theme: "PaperMod"
  config_file: "hugo.toml"

deployment:
  target_repo: "bluhuang/blogs-of-bluhuang"
  target_branch: "gh-pages"
  commit_message: "Auto deploy from blog poster [skip ci]"
