source:
  repo: "blu-obsidian"
  owner: "bluhuang"
  branch: "main"
  notes_subdir: "2 Notes"
  notes_dir: "content/"
  file_pattern: "*.md"

processing:
  image_processing: true
  image_download_dir: "static/images/"
  incremental: true
  cache_file: ".hash_cache.json"
  image_handling:
    enabled: true
    source_images_dir: ""
    target_static_dir: "static/images"
  deepseek_api:
    model: "deepseek-v4-flash"
    temperature: 0.3
    max_tokens: 4000
    prompt_template: '请对以下Markdown内容进行脱敏（删除公司名、人名等）、润色语句、删除所有与"面试"相关的内容。注意：不要修改任何图片链接语法，保持![alt](url)原样。原文：\n\n{content}'

output:
  repo: "blogs-of-bluhuang"
  owner: "bluhuang"
  branch: "gh-pages"
  content_dir: "content/"
  static_dir: "static/"

error:
  failed_log: "failed_notes.log"
  max_retries: 3

hugo:
  base_url: "https://bluhuang.github.io/blogs-of-bluhuang/"
  theme: "PaperMod"
  config_file: "hugo.toml"

deployment:
  commit_message: "chore: auto-deploy blog update"
  local_path: "."
