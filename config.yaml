source:
  repo: "blu-obsidian"
  owner: "bluhuang"
  branch: "main"
  notes_subdir: "2 Notes"
  notes_dir: "content/"
  file_pattern: "*.md"

processing:
  image_processing: true
  image_download_dir: "static/images/"
  incremental: true
  cache_file: ".hash_cache.json"
  local_vault_path: ""
  force_reprocess_all: true
  title_source: "filename"   # "filename" 或 "h1" — 默认使用文件名（去除序号），h1 则从内容提取第一个 # 标题
  title_strip_prefix:
    enabled: true
    pattern: "^\\d+\\s*[-.]?\\s*"
  image_handling:
    enabled: true
    source_images_dir: "attachments"
    target_static_dir: "static"
    # wiki_image_lookup:  # ← 可选覆盖，不配置则自动从 .obsidian/app.json 读取
    #   - type: "same_dir"
    #   - type: "relative_subdir"
    #     subdir: "attachments"
  deepseek_api:
    model: "deepseek-v4-flash"
    temperature: 0.3
    max_tokens: 4000
    prompt_template: '请对以下Markdown内容进行脱敏（删除公司名、人名等）、润色语句、删除所有与"面试"相关的内容。只输出处理后的纯Markdown内容，不要添加任何解释、不要添加"好的"、"以下是处理后的内容"等前缀或后缀，直接输出结果。\n\n原文：\n\n{content}'
    system_prompt: |
      你是一个技术博客编辑助手。请对以下Markdown内容进行脱敏（删除公司名、人名等），并将所有与求职、面试、招聘、简历、offer、跳槽等相关的内容改写成纯粹的技术讨论，删除明显的求职字眼但保留技术实质。同时润色语句。只输出处理后的纯Markdown内容，不要添加任何解释或前缀。

output:
  repo: "blogs-of-bluhuang"
  owner: "bluhuang"
  branch: "gh-pages"
  content_dir: "content/"
  static_dir: "static/"

error:
  failed_log: "failed_notes.log"
  max_retries: 3

hugo:
  executable: "hugo"
  build_options: "--minify"

deployment:
  target_repo: "bluhuang/blogs-of-bluhuang"
  target_branch: "gh-pages"
  commit_message: "Auto deploy from blog poster [skip ci]"
