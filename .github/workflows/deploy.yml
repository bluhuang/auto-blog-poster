name: Deploy Blog

on:
  push:
    branches: ["main"]
  repository_dispatch:
    types: [trigger-deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/hugo_cache
          key: hugo-modules-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: hugo-modules-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Generate theme CSS
        run: bash scripts/regenerate-theme.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install validation browser
        run: playwright install --with-deps chromium

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.162.1"
          extended: true

      - name: Pre-download Hugo modules
        run: hugo mod graph
        timeout-minutes: 10

      - name: Run auto-blog-poster
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -o pipefail
          mkdir -p public
          python main.py 2>&1 | tee /tmp/auto_blog_output.log public/ci_log.txt

      - name: Count notes (source vs generated)
        shell: bash
        run: |
          SRC=$(find .temp/source_repo/2\ Notes -name "*.md" 2>/dev/null | wc -l)
          GEN=$(find content -name "*.md" 2>/dev/null | wc -l)
          echo "Source notes: $SRC"
          echo "Generated content files: $GEN"
          if [ "$SRC" -ne "$GEN" ]; then
            echo "::warning title=Notes count mismatch::Source has $SRC files, generated has $GEN files"
          else
            echo "::notice title=Notes count OK::$SRC source → $GEN generated"
          fi

      - name: Upload auto-blog-poster log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-blog-log
          path: /tmp/auto_blog_output.log
          retention-days: 7

      - name: Persist sanitized failure summary
        if: failure()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          SUMMARY=/tmp/ci_failure_summary.txt
          {
            echo "workflow_commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "===== last 400 log lines ====="
            if [ -f /tmp/auto_blog_output.log ]; then
              tail -n 400 /tmp/auto_blog_output.log
            else
              echo "auto_blog_output.log was not created; failure occurred before the pipeline step."
            fi
          } > "$SUMMARY"
          python - "$SUMMARY" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8", errors="replace")
          patterns = [
              (r"(?i)(authorization\s*[:=]\s*bearer\s+)[^\s]+", r"\1[REDACTED]"),
              (r"(?i)((?:api[_-]?key|token|password|secret)\s*[:=]\s*)[^\s]+", r"\1[REDACTED]"),
              (r"https://x-access-token:[^@\s]+@github\.com", "https://x-access-token:[REDACTED]@github.com"),
          ]
          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text)
          path.write_text(text, encoding="utf-8")
          PY
          rm -rf /tmp/blog-cache-diagnostics
          git clone --depth=1 --branch processed-cache "https://x-access-token:${GH_PAT}@github.com/bluhuang/blogs-of-bluhuang.git" /tmp/blog-cache-diagnostics
          cp "$SUMMARY" /tmp/blog-cache-diagnostics/.ci_failure_summary.txt
          cd /tmp/blog-cache-diagnostics
          git config user.name "Auto Blog Poster"
          git config user.email "actions@github.com"
          git add .ci_failure_summary.txt
          git commit -m "Update CI failure diagnostic [skip ci]" || true
          git push origin processed-cache

      - name: Upload public artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: public/
          retention-days: 7
