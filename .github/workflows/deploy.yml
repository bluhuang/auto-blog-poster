name: Deploy Blog

on:
  push:
    branches: ["main"]
  repository_dispatch:
    types: [trigger-deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/hugo_cache
          key: hugo-modules-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: hugo-modules-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Generate theme CSS
        run: node themes/hugoplate/scripts/themeGenerator.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.162.1"
          extended: true

      - name: Pre-download Hugo modules
        run: hugo mod graph
        timeout-minutes: 10

      - name: Run auto-blog-poster
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -o pipefail
          mkdir -p public
          python main.py 2>&1 | tee /tmp/auto_blog_output.log public/ci_log.txt

      - name: Count notes (source vs generated)
        shell: bash
        run: |
      - name: Count notes (source vs generated)
        shell: bash
        run: |
          SRC=$(find .temp/source_repo/2\ Notes -name "*.md" 2>/dev/null | wc -l)
          GEN=$(find content -name "*.md" 2>/dev/null | wc -l)
          echo "Source notes: $SRC"
          echo "Generated content files: $GEN"
          if [ "$SRC" -ne "$GEN" ]; then
            echo "::warning title=Notes count mismatch::Source has $SRC files, generated has $GEN files"
          else
            echo "::notice title=Notes count OK::$SRC source → $GEN generated"
          fi

      - name: Upload auto-blog-poster log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-blog-log
          path: /tmp/auto_blog_output.log
          retention-days: 7

      - name: Upload public artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: public/
          retention-days: 7
